<!DOCTYPE html>
<!--houses.index.html-->
<!--民宿一覧ページ-->
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--thymeleafの機能が使えるようになる-->

<head>
	<!--fragmentで呼び出すので、ここはいらなくなる-->
	<!--meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1"-->
	<div th:replace="~{fragment :: meta}"></div>

	<!--↓ここから下style fragmentで呼び出すのでいらなくなる-->
	<!-- Bootstrap -->
	<!--cssフレームワーク-->
	<!--link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"-->

	<!-- Google Fonts -->
	<!--Google Fontsを導入するためのコード-->
	<!--link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

	<link th:href="@{/css/style.css}" rel="stylesheet"-->
	<div th:replace="~{fragment :: styles}"></div>

	<title>民宿一覧</title>
</head>

<body>
	<div class="moattravel-wrapper">

		<!--header fragmentで呼び出し-->
		<!-- ヘッダー -->
		<!--nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm moattravel-navbar">
			<div class="container moattravel-container"-->

		<!--th:href="@{/}"→{}のなかのページに移動できる-->
		<!--a class="navbar-brand" th:href="@{/}"-->
		<!--th:src="@{/images/logo.png}→logo.pngのファイルが表示される-->
		<!--img class="moattravel-logo me-1" th:src="@{/images/logo.png}" alt="moat Travel">
				</a>
			</div>
		</nav-->
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pt-4 pb-5 moattravel-container">
				<div class="row justify-content-center">
					<div class="col-xxl-9 col-xl-10 col-lg-11">

						<h1 class="mb-4 text-center">民宿一覧</h1>

						<!--中央に表示-->
						<div class="d-flex justify-content-end">
							<!--横に広げる-->
							<div class="d-flex justify-content-between align-items-end flex-wrap">
								<form method="get" th:action="@{/admin/houses}" class="mb-3">
									<div class="input-group">
										<!--th:value→検索としていれた文字をそのまま残す機能-->
										<input type="text" class="form-control" name="keyword" th:value="${keyword}"
											placeholder="民宿名">
										<button type="submit" class="btn text-white shadow-sm moattravel-btn">
											検索
										</button>
									</div>
								</form>
							</div>
							<!--ms-autoを入れることで左側に大きな空欄ができる-->
							<a th:href="@{/admin/houses/register}"
								class="btn text-white shadow-sm mb-3 moattravel-btn ms-auto">登録</a>
						</div>
						<!--登録成功メッセージを表示させる部分-->
						<div th:if="${successMessage}" class="alert alert-info">
							<span th:text="${successMessage}"></span>
						</div>

						<!--民宿一覧テーブル-->
						<table class="table">
							<thead>
								<tr>
									<th scope="col">ID</th>
									<th scope="col">民宿名</th>
									<th scope="col">郵便番号</th>
									<th scope="col">住所</th>
									<th scope="col">電話番号</th>
									<th scope="col"></th>
								</tr>
							</thead>
							<tbody>

								<!--th:eachは繰り返し処理を行うための機能。コントローラーで記述したhousePageが繰り返し使われる-->
								<!--tr th:each="house : ${houses}"←いらない-->
								<tr th:each="house : ${housePage}">

									<!--th:text→html要素として出力できる-->
									<td th:text="${house.getId()}"></td>
									<td th:text="${house.getName()}"></td>
									<td th:text="${house.getPostalCode()}"></td>
									<td th:text="${house.getAddress()}"></td>
									<td th:text="${house.getPhoneNumber()}"></td>
									<td><a th:href="@{/admin/houses/__${house.getId()}__}">詳細</a></td>
									<td><a href="#" class="moattravel-link-danger" data-bs-toggle="modal"
											th:data-bs-target="${'#deleteHouseModal' + house.getId()}">削除</a></td>

									<!--削除モダール-->
									<!--モダール=今開いている画面の上に重ねて表示される小さなウィンドウ-->
									<div class="modal fade" th:id="${'deleteHouseModal' + house.getId()}" tabindex="-1"
										th:aria-labelledby="${'deleteHouseModalLabel' + house.getId()}">

										<div class="modal-dialog">
											<div class="modal-content">

												<div class="modal-header">
													<h5 class="modal-title"
														th:id="${'deleteHouseModalLabel' + house.getId()}"
														th:text="${house.getName() + 'を削除してもよろしいですか？'}">
													</h5>
													<button type="button" class="btn-close" data-bs-dismiss="modal"
														aria-label="閉じる">
													</button>
												</div>

												<div class="modal-footer">
													<form method="post"
														th:action="@{/admin/houses/__${house.getId()}__/delete}">
														<button type="submit"
															class="btn moattravel-btn-danger text-white shadow-sm">
															削除
														</button>
													</form>
												</div>

											</div>
										</div>
									</div>
								</tr>
							</tbody>
						</table>

						<!-- ページネーション -->
						<!--th:if→${}のなかの条件を満たした時のみ発動-->
						<div th:if="${housePage.getTotalPages() > 1}" class="d-flex justify-content-center">
							<nav aria-label="民宿一覧ページ">
								<ul class="pagination">
									<li class="page-item">

										<!--現在のページが最初のページだったらtrue、そうでなければfalseを返す-->
										<span th:if="${housePage.isFirst()}" class="page-link disabled">前</span>
										<!--falseの時はこっちが表示される-->
										<!--検索機能がない場合の表示方法-->
										<!--a th:unless="${housePage.isFirst()}"
											th:href="@{/admin/houses(page=${housePage.getNumber() - 1})}"
											class="page-link moattravel-page-link">前</a>-->
										<a th:unless="${housePage.isFirst()}"
											th:href="@{/admin/houses(page = ${housePage.getNumber() - 1}, keyword = ${keyword})}"
											class="page-link moattravel-page-link">前</a>
									</li>

									<!--#は、ユーティリティオブジェクトというthymeleaf内で使用できるオブジェクトのこと-->
									<!--連番を生成-->
									<li th:each="i : ${#numbers.sequence(0, housePage.getTotalPages() - 1)}"
										class="page-item">
										<!--現在ページの表示-->
										<span th:if="${i == housePage.getNumber()}"
											class="page-link active moattravel-active" th:text="${i + 1}"></span>
										<!--現在のページではないページに移動する際の動き-->
										<!--検索機能ない場合-->
										<!--a th:unless="${i == housePage.getNumber()}"
											th:href="@{/admin/houses(page=${i})}" class="page-link moattravel-page-link"
											th:text="${i + 1}"></a>-->
										<a th:unless="${i == housePage.getNumber()}"
											th:href="@{/admin/houses(page = ${i}, keyword = ${keyword})}"
											class="page-link moattravel-page-link" th:text="${i + 1}"></a>
									</li>

									<li class="page-item">

										<!--現在のページが最後のページだったらtrue、そうでなければfalseを返す-->
										<span th:if="${housePage.isLast()}" class="page-link disabled">次</span>
										<!--検索機能ない場合-->
										<!--a th:unless="${housePage.isLast()}"
											th:href="@{/admin/houses(page=${housePage.getNumber() + 1})}"
											class="page-link moattravel-page-link">次</a>-->
										<a th:unless="${housePage.isLast()}"
											th:href="@{/admin/houses(page = ${housePage.getNumber() + 1}, keyword = ${keyword})}"
											class="page-link moattravel-page-link">次</a>
									</li>
								</ul>
							</nav>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!--footer fragmentで呼び出し-->
		<!-- フッター -->
		<!--footer>
			<div class="d-flex justify-content-center align-items-center h-100">
				<p class="text-center text-muted small mb-0">&copy; moat Travel All rights reserved.</p>
			</div>
		</footer-->
		<div th:replace="~{fragment :: footer}"></div>
	</div>

	<!--scripts fragmentで呼び出し-->
	<!-- Bootstrap -->
	<!--script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
		crossorigin="anonymous"></script-->
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
