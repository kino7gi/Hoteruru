<section id="previewArea" th:fragment="confirm_view">
	<div class="modal-content">
		<h3>Confirmation</h3>

		<dl>
			<dt>Selected Scent</dt>
			<dd>
				<span th:each="name, iterStat : ${orderForm.scentNames}">
					<span th:text="${name}">Floral</span>
					<th:block th:if="${!iterStat.last}"> / </th:block>
				</span>
				<span th:if="${orderForm.scentNames == null || orderForm.scentNames.empty}">No Scent Selected</span>
			</dd>

			<dt>Selected Bottle</dt>
			<dd th:text="${orderForm.bottleName}">Square</dd>

			<dt>Post Code</dt>
			<dd id="displayPostCode"></dd>

			<dt>Address</dt>
			<dd id="displayAddress"></dd>

			<dt>Phone number</dt>
			<dd id="displayPhoneNumber"></dd>

			<dt>Customer Name</dt>
			<dd id="displayName"></dd>
		</dl>

		<div class="preview-actions">
			<button type="button" class="btn-back" onclick="hidePreview()">Back to edit</button>
			<button type="submit" class="btn-submit">Confirm Order</button>
		</div>
	</div>
</section>
