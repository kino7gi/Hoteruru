<section id="inputSection" th:fragment="input_form" class="fade-in">
	<h2>Shipping Information</h2>

	<div class="input-group">
		<label for="address">Destination Address</label>
		<input type="text" th:field="*{address}" id="address" placeholder="例：東京都中央区銀座 1-2-3" required>
	</div>

	<div class="input-group">
		<label for="userName">Customer Name</label>
		<input type="text" th:field="*{userName}" id="userName" placeholder="お名前をご入力ください" required>
	</div>

	<div class="actions">
		<button type="button" class="btn-preview" onclick="showPreview()">Review Order</button>
	</div>
</section>
