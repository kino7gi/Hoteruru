<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments :: head('Your Special Blend')}"></head>

<body class="result-body">
	<div th:replace="~{layout/fragments :: background}"></div>

	<div class="result-card">
		<p class="thank-you-text">THANK YOU</p>
		<h1 class="blend-title" th:text="${title}">Order Received</h1>
		<p class="blend-message" th:text="${message}">Order Message</p>

		<div class="receipt-body">
			<div class="section">
				<h3>Selected Blend</h3>
				<div class="details">
					<p><strong>Scent:</strong>
						<span th:each="s, iterStat : ${selectedScents}"
							th:text="${s} + ${!iterStat.last ? ' & ' : ''}"></span>
					</p>
					<p><strong>Bottle:</strong> <span th:text="${selectedBottle}"></span></p>
					<hr>
					<p class="price-tag">
						<strong>Total Price:</strong>
						<span th:text="'¥' + ${#numbers.formatInteger(totalPrice, 3, 'COMMA')}"></span>
					</p>
				</div>
			</div>
		</div>

		<a th:href="@{/}" class="order-button" style="text-decoration: none;">BACK TO TOP</a>
	</div>
</body>

</html>
