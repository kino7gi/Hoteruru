<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/header :: common_head}"></head>
<link rel="stylesheet" th:href="@{/css/admin.css}">

<body>
	<main class="admin-container">
		<h1>Inventory Control</h1>

		<section class="admin-section">
			<h2>Scent Repertoire</h2>
			<table class="admin-table">
				<thead>
					<tr>
						<th>Scent Name</th>
						<th>Description</th>
						<th>Stock</th>
						<th>Image</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>

					<tr th:each="scent : ${scents}">
						<td th:text="${scent.name}">Rose</td>
						<td>
							<textarea class="input-desc scent-description" th:text="${scent.description}"></textarea>
						</td>
						<td>
							<input type="number" th:value="${scent.stock}" class="input-stock scent-stock">
						</td>
						<td>
							<div class="admin-thumb-container">
								<img th:src="${scent.imageUrl != null} ? @{/images/{name}(name=${scent.imageUrl})} : @{/images/no-image.jpg}"
									alt="photo" class="admin-thumb">
							</div>
						</td>
						<td class="admin-actions">
							<button class="btn-update"
								th:onclick="|updateScentStock(${scent.id}, this)|">Update</button>
							<button class="btn-delete" th:onclick="|deleteScent(${scent.id})|">🗑</button>
						</td>
				</tbody>
				<tfoot>
					<tr class="add-row">
						<td><input type="text" id="newScentName" placeholder="New Scent Name"></td>
						<td><textarea id="newScentDescription" placeholder="香りの説明を入力"></textarea></td>
						<td><input type="number" id="newScentStock" value="0"></td>
						<td><input type="file" id="newScentImage"></td>
						<td><button class="btn-add" onclick="addScent()">+ Add New</button></td>
					</tr>
				</tfoot>
			</table>
		</section>

		<section class="admin-section">
			<h2>Bottle Repertoire</h2>
			<table class="admin-table">
				<thead>
					<tr>
						<th>Bottle Type</th>
						<th>Capacity</th>
						<th>Stock</th>
						<th>Image</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="bottle : ${bottles}">
						<td th:text="${bottle.name}">Square</td>
						<td th:text="${bottle.capacity}">50ml</td>
						<td>
							<input type="number" th:value="${bottle.stock}" class="input-stock bottle-stock">
						</td>
						<td>
							<img th:src="${bottle.imageUrl != null} ? @{/images/{name}(name=${bottle.imageUrl})} : @{/images/no-image.jpg}"
								alt="photo" class="admin-thumb">
						</td>
						<td class="admin-actions">
							<button class="btn-update"
								th:onclick="|updateBottleStock(${bottle.id}, this)|">Update</button>
							<button class="btn-delete" th:onclick="|deleteBottle(${bottle.id})|">🗑</button>
						</td>
					</tr>
				</tbody>
				<tfoot>
					<tr class="add-row">
						<td><input type="text" id="newBottleName" placeholder="Shape Name"></td>
						<td><input type="text" id="newBottleCapacity" placeholder="50ml"></td>
						<td><input type="number" id="newBottleStock" value="0"></td>
						<td><input type="file" id="newBottleImage"></td>
						<td><button class="btn-add" onclick="addBottle()">+ Add New</button></td>
					</tr>
				</tfoot>
			</table>
		</section>
	</main>

	<script th:src="@{/js/admin.js}"></script>
</body>

</html>
