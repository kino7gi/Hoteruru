<div th:fragment="address" id="address-section" class="hidden">
	<div class="address-card">
		<header class="section-header">
			<p class="step-label">STEP 03</p>
			<h3>SHIPPING DETAILS</h3>
			<p class="sub-text">お届け先情報を入力してください</p>
		</header>

		<div class="address-inputs">
			<div class="input-group">
				<label>お名前</label>
				<input type="text" id="userName" name="userName" placeholder="香水 太郎" required>
			</div>
			<div class="input-group">
				<label>ご住所</label>
				<input type="text" id="userAddress" name="userAddress" placeholder="東京都渋谷区..." required>
			</div>
			<div class="input-group">
				<label>電話番号</label>
				<input type="tel" id="userTel" name="userTel" placeholder="090-0000-0000" required>
			</div>
		</div>

		<button type="button" id="to-preview-btn" class="order-button">CONFIRM ORDER</button>
		<button type="button" id="back-to-selection" class="secondary-button">戻る</button>
	</div>
</div>
