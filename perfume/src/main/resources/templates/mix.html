<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{layout/header :: common_head}"></th:block>

	<link rel="stylesheet" th:href="@{/css/mix.css}">
</head>

<body>
	<main class="mix-container">
		<section class="preview-section fade-in">
			<div class="perfume-visual">
				<img id="img-bottle" th:src="@{/images/no-image.jpg}" alt="Bottle" style="z-index: 2;">
			</div>
		</section>

		<form th:action="@{/order}" th:object="${orderForm}" method="post" class="mix-form">

			<fieldset class="selection-group">
				<legend>01. Select Scent</legend>
				<div class="options">
					<label th:each="scent : ${scents}">
						<input type="radio" th:field="*{scentId}" th:value="${scent.id}" onchange="updatePreview()">
						<span th:text="${#strings.toUpperCase(scent.name)}">SCENT NAME</span>
					</label>
				</div>
			</fieldset>

			<fieldset class="selection-group fade-in">
				<legend>02. Select Bottle</legend>
				<div class="options">
					<label th:each="bottle : ${bottles}">
						<input type="radio" th:field="*{bottleId}" th:value="${bottle.id}"
							th:data-bottle="${bottle.imageUrl != null} ? @{/images/{name}(name=${bottle.imageUrl})} : @{/images/no-image.jpg}"
							onchange="updatePreview()">
						<span th:text="${#strings.toUpperCase(bottle.name)}">BOTTLE NAME</span>
					</label>
				</div>
			</fieldset>

			<nav class="form-navigation fade-in">
				<button type="submit" class="btn-next">CONFIRM ORDER</button>
			</nav>
		</form>
	</main>

	<script th:src="@{/js/mix.js}"></script>
	<script th:src="@{/js/script.js}"></script>
</body>

</html>
